<!doctype html>
<html lang="id">
  <head>
    <link rel="stylesheet" href="assets/css/style.css" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Form Pendaftaran</title>
  </head>

  <body>
    <nav>
      <a href="index.html">Beranda</a> | <a href="profil.html">Profil</a> | <a href="layanan.html">Layanan</a> |
      <a href="daftar.html">Daftar</a>
    </nav>

    <hr />

    <h1>Form Pendaftaran</h1>

    <div id="konten">
      <form id="formDaftar" action="#" method="POST">
        <label>Nama Lengkap:</label><br />
        <input id="nama" type="text" name="Nama" placeholder="Masukkan nama lengkap" /><br /><br />

        <label>Email:</label><br />
        <input id="email" type="email" name="Email" placeholder="Masukkan email" /><br /><br />

        <label>Password:</label><br />
        <input id="password" name="password" name="Password" /><br /><br />

        <label>Jenis Kelamin:</label><br />
        <input type="radio" name="jk" value="L" /> Laki-laki <input type="radio" name="jk" value="P" /> Perempuan<br /><br />

        <label>No. HP:</label><br />
        <input type="tel" name="hp" placeholder="Masukkan nomor HP" /><br /><br />

        <label>Tanggal Lahir:</label><br />
        <input type="date" name="tgl_lahir" /><br /><br />

        <label>Hobi:</label><br />
        <input type="checkbox" name="hobi" /> Membaca <input type="checkbox" name="hobi" /> Olahraga <input type="checkbox" name="hobi" /> Gaming<br /><br />

        <label>Jurusan:</label><br />
        <select name="jurusan">
          <option value="TI">Teknologi Informasi</option>
          <option value="SI">Sistem Informasi</option></select
        ><br /><br />

        <label>Alamat:</label><br />
        <textarea name="alamat"></textarea><br /><br />

        <button type="submit">Daftar</button>
      </form>

      <p id="pesan"></p>
    </div>

    <script src="assets/js/script.js"></script>
  </body>
</html>
